<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./cinzel.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 264px; overflow: hidden; background: #0b090e; }
      .card {
        position: relative;
        width: 1200px;
        height: 264px;
        overflow: hidden;
        background: #0b090e;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          url("file:///workspace/public/art/title.jpg") center 78% / cover no-repeat;
        filter: saturate(1.05) contrast(1.08);
      }
      .wash {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(11, 9, 14, 0.92) 0%,
            rgba(11, 9, 14, 0.78) 22%,
            rgba(42, 22, 56, 0.42) 48%,
            rgba(11, 9, 14, 0.12) 68%,
            rgba(11, 9, 14, 0.08) 100%
          ),
          linear-gradient(
            180deg,
            rgba(11, 9, 14, 0.18) 0%,
            rgba(11, 9, 14, 0) 28%,
            rgba(11, 9, 14, 0.55) 100%
          );
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.14;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92  0 0 0 0 0.89  0 0 0 0 0.86  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        mix-blend-mode: overlay;
      }
      .lockup {
        position: absolute;
        left: 52px;
        top: 34px;
        color: #ece4dc;
        font-family: CinzelCard, Cinzel, "Liberation Serif", serif;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-shadow:
          0 1px 0 rgba(11, 9, 14, 0.9),
          0 8px 22px rgba(11, 9, 14, 0.85);
        max-width: 520px;
      }
      .lockup .line {
        display: block;
        font-size: 44px;
        line-height: 0.98;
        font-weight: 700;
      }
      .rule {
        width: 118px;
        height: 3px;
        margin-top: 14px;
        background: #c41e3a;
        box-shadow: 0 0 12px rgba(196, 30, 58, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg"></div>
      <div class="wash"></div>
      <div class="grain"></div>
      <div class="lockup">
        <span class="line">SHADOW</span>
        <span class="line">SHINOBI</span>
        <div class="rule"></div>
      </div>
    </div>
  </body>
</html>
